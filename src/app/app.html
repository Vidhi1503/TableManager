<div class="login-layout">

  <!-- Left Login Panel -->
  <section class="brand-panel">

    <div class="brand-logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="3" width="18" height="18" rx="2" />
          <path d="M3 9h18M9 3v18" />
        </svg>
      </div>

      <span>Table Manager</span>
    </div>

    <div class="brand-content">
      <h1>
        Manage your database
        tables from one place.
      </h1>

      <p>
        View, add, edit and delete records without working directly
        in MySQL.
      </p>
    </div>
  </section>

  <!-- Right Login Panel -->
  <section class="login-panel">

    <div class="login-container">
      <h2>Sign in</h2>

      <p class="login-subtitle">
        Use your authorized account to continue.
      </p>

      <div class="login-form">

        <!-- Email entry -->
        <div class="form-group">
          <label for="email">Email or username</label>

          <input type="text" id="email" placeholder="admin@example.com" autocomplete="username" />
        </div>

        <!-- Password entry -->
        <div class="form-group password-group">

          <label for="password">Password</label>

          <input id="password" [type]="showPassword ? 'text' : 'password'" placeholder="Enter your password"
            autocomplete="current-password" />

          <!-- Font Awesome Eye Icon -->
          <button type="button" class="password-toggle" (click)="togglePassword()"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
            <i [class]="showPassword ? 'fa-regular fa-eye' : 'fa-regular fa-eye-slash'"></i>
          </button>

        </div>

        <!-- Sign in -->
        <button type="button" class="sign-in-button" (click)="onSignIn()">
          Sign in
        </button>

        <!-- Sign up -->
        <div class="create-account-signup">
          <p>Don't have an account?</p>
          <button type="button" class="sign-up-button" (click)="onSignUp()">
            Sign up
          </button>
        </div>

      </div>
    </div>

  </section>

</div>
